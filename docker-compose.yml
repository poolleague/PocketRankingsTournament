services:
  tournament-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TOURNAMENT_DB_NAME:-pocketrankings_tournament}
      POSTGRES_USER: ${TOURNAMENT_DB_USER:-tournament_app}
      POSTGRES_PASSWORD: ${TOURNAMENT_DB_PASSWORD:?Set TOURNAMENT_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - tournament_postgres:/var/lib/postgresql/data
    networks: [tournament-internal]

  tournament-app:
    build:
      context: ./src/PocketRankingsTournament
    depends_on:
      tournament-db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${TOURNAMENT_ENVIRONMENT:-Production}
      ConnectionStrings__TournamentDatabase: Host=tournament-db;Port=5432;Database=${TOURNAMENT_DB_NAME:-pocketrankings_tournament};Username=${TOURNAMENT_DB_USER:-tournament_app};Password=${TOURNAMENT_DB_PASSWORD}
      Privacy__SuppressionHashKey: ${TOURNAMENT_PRIVACY_SUPPRESSION_KEY:?Set TOURNAMENT_PRIVACY_SUPPRESSION_KEY}
    ports:
      - "127.0.0.1:${TOURNAMENT_HTTP_PORT:-5180}:8080"
    restart: unless-stopped
    networks: [tournament-internal]

networks:
  tournament-internal:
    internal: true

volumes:
  tournament_postgres:
